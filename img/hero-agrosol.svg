<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3d62"/>
      <stop offset="45%" stop-color="#1e5f8a"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d5a45" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a2e1f" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect y="520" width="1600" height="380" fill="url(#ground)"/>

  <!-- Equipo industrial estilizado (sin marcas) -->
  <rect x="680" y="340" width="520" height="220" rx="8" fill="#1a5276"/>
  <rect x="700" y="360" width="480" height="140" rx="4" fill="#2980b9"/>
  <text x="940" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="72" font-weight="800" fill="rgba(255,255,255,0.92)" letter-spacing="6">AgroSol</text>

  <rect x="620" y="480" width="80" height="100" rx="4" fill="#c0392b"/>
  <rect x="1180" y="480" width="80" height="100" rx="4" fill="#c0392b"/>
  <circle cx="660" cy="590" r="42" fill="#2c3e50" stroke="#555" stroke-width="8"/>
  <circle cx="1220" cy="590" r="42" fill="#2c3e50" stroke="#555" stroke-width="8"/>

  <!-- Tubera / perforacin -->
  <rect x="200" y="620" width="900" height="24" rx="4" fill="#7f8c8d"/>
  <rect x="200" y="660" width="600" height="18" rx="3" fill="#95a5a6"/>
  <ellipse cx="200" cy="632" rx="28" ry="28" fill="#bdc3c7"/>

  <!-- Operarios estilizados -->
  <circle cx="280" cy="580" r="18" fill="#f5cba7"/>
  <rect x="265" y="598" width="30" height="45" rx="4" fill="#2980b9"/>
  <circle cx="280" cy="568" r="16" fill="#f1c40f"/>

  <circle cx="340" cy="585" r="16" fill="#f5cba7"/>
  <rect x="327" y="601" width="26" height="40" rx="4" fill="#27ae60"/>
  <circle cx="340" cy="574" r="14" fill="#3498db"/>

  <!-- Gota de agua decorativa -->
  <path d="M1350 200c0-55 45-100 45-100s45 45 45 100a45 45 0 1 1-90 0z" fill="rgba(79,195,247,0.25)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- Sticker AgroSol -->
  <rect x="1080" y="500" width="200" height="56" rx="4" fill="rgba(255,255,255,0.92)"/>
  <text x="1180" y="522" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#2196d3">AgroSol INDUSTRIAL</text>
  <text x="1180" y="542" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#555">TEL: +503 7802-3519</text>
</svg>
